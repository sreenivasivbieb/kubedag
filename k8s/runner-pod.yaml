# Runner pool.
#
# A StatefulSet, not a Deployment. The pod pool leases pods BY NAME, and a
# lease recorded as "runner-3" must still refer to runner-3 after a restart.
# Deployment pods get random suffixes, so a lease would dangle after a rollout.
#
# Pod names are the identity the control plane stores. That is also why
# discovery sorts names and strips the ordinal rather than trusting whatever
# order the API returns.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runner
  namespace: kubedag-runner
  labels:
    app: runner
    app.kubernetes.io/part-of: kubedag
spec:
  serviceName: runner
  replicas: 7
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: runner
  template:
    metadata:
      labels:
        app: runner
        app.kubernetes.io/part-of: kubedag
    spec:
      # Runner pods execute untrusted commands. They must never talk to the
      # Kubernetes API: any step that obtained a token could list secrets or
      # exec into other pods in the namespace.
      automountServiceAccountToken: false

      # Restricted PSS profile. Phase 9 layers on NetworkPolicy and quota.
      securityContext:
        runAsNonRoot: true
        # Must match the image's USER. busybox cannot create uid 65532 (its
        # addgroup caps at 60000), so we use the uid busybox already ships.
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: runner
          image: kubedag-runner:v0
          # The container just stays alive. Steps are exec'd in, not run as
          # the entrypoint, which is what makes a warm pool possible.
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # /work must be writable for steps
            capabilities:
              drop: ["ALL"]
          lifecycle:
            postStart:
              exec:
                command: ["/bin/sh", "-c", "mkdir -p /work && chmod 777 /work"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        # tmpfs, not disk: a step's scratch data must not outlive the pod and
        # must never be written to a node's disk.
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      # Short grace: steps are killed and re-run, not patiently drained.
      terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: kubedag-runner
  labels:
    app: runner
spec:
  clusterIP: None
  selector:
    app: runner
  ports:
    - name: http
      port: 8080
      targetPort: 8080