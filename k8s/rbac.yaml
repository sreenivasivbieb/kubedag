# Least privilege for the orchestrator.
#
# The orchestrator needs exactly two verbs:
#   pods/exec  - to run a step's command
#   pods/get   - to probe liveness
# plus list, to discover the pool at boot.
#
# It deliberately does NOT have: create/delete pods, read pods/log, exec into
# anything but its namespace, or any access to secrets. A compromised
# orchestrator must not be able to scale the pool, read credentials, or exec
# outside its own namespace.
#
# The runner pods get a separate ServiceAccount with no permissions at all;
# see runner-pod.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubedag-orchestrator
  namespace: kubedag-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubedag-orchestrator
  namespace: kubedag-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# RoleBindings are namespace-scoped. There is deliberately no ClusterRole: a
# namespace-wide mistake should not become a cluster-wide capability.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubedag-orchestrator
  namespace: kubedag-runner
subjects:
  - kind: ServiceAccount
    name: kubedag-orchestrator
    namespace: kubedag-runner
roleRef:
  kind: Role
  name: kubedag-orchestrator
  apiGroup: rbac.authorization.k8s.io
