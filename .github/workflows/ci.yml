name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: typecheck + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: unit tests
        run: bun test
      - name: build runner image
        run: docker build -t kubedag-runner:v0 -f k8s/runner/Dockerfile k8s/runner

  integration:
    name: integration (kind)
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile

      - name: install kind
        run: |
          curl -sLo ./kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/

      - name: bring up cluster + redis + runners
        run: ./scripts/setup.sh --infra-only

      # Integration tests arrive in Phase 7 (crash recovery) and Phase 9
      # (security verification). This job exists now so cluster provisioning
      # is proven continuously rather than discovered broken when first needed.
      - name: verify stack
        run: |
          kubectl -n kubedag-runner get pods
          kubectl -n kubedag-runner wait --for=condition=Ready pod -l app=runner --timeout=180s
          test "$(kubectl -n kubedag-runner get pods -l app=runner --no-headers | grep -c Running)" -eq 7

      - name: dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n kubedag-runner get pods -o wide || true
          kubectl -n kubedag-runner describe pods || true
          kubectl -n kubedag-runner logs -l app=runner --tail=200 || true

      - name: teardown
        if: always()
        run: ./scripts/teardown.sh || true
