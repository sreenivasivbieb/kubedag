apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
  namespace: kubedag
  labels:
    app.kubernetes.io/part-of: kubedag
# Dev-only credentials. Phase 9 replaces this with an external secret store.
type: Opaque
stringData:
  POSTGRES_USER: kubedag
  POSTGRES_PASSWORD: kubedag
  POSTGRES_DB: kubedag
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: kubedag
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubedag
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: kubedag
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubedag
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: kubedag
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-auth
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "kubedag"]
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "kubedag"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        # emptyDir, not a PVC: losing dev data on teardown is desirable.
        # Production would use a PVC with a real storage class.
        - name: data
          emptyDir: {}