# Runner pool.
#
# A StatefulSet, not a Deployment, because we lease pods BY NAME and a lease
# must survive an orchestrator restart. Deployment pods get random suffixes
# (runner-abc12), so a lease recorded as "runner-abc12" could reference a pod
# that no longer exists after a rollout. StatefulSet gives runner-0, runner-1,
# ... which are stable for the life of the StatefulSet.
#
# Pods here are deliberately NOT given a readiness gate tied to our lease
# state: readiness must reflect the pod's own health, not whether the control
# plane currently wants it. Conflating the two makes a lease expiry look like
# a pod failure to the kubelet.
apiVersion: v1
kind: Service
metadata:
  name: runner
  namespace: kubedag
  labels:
    app.kubernetes.io/name: runner
    app.kubernetes.io/part-of: kubedag
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: runner
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runner-pool
  namespace: kubedag
  labels:
    app.kubernetes.io/name: runner
    app.kubernetes.io/part-of: kubedag
spec:
  serviceName: runner
  # Pool size matches KUBEDAG_POOL_SIZE default. Overcommitting is possible but
  # each concurrent exec consumes a container's PID budget.
  replicas: 5
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner
        app.kubernetes.io/part-of: kubedag
      annotations:
        # Restarting a step means killing the exec'd process inside the pod,
        # not the pod. Added in Phase 3.
        kubedag.dev/cleanup-required: "true"
    spec:
      # Runner pods should never talk to the Kubernetes API. Any step that
      # somehow obtained a service-account token could list secrets or exec
      # into other pods.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532   # nonroot, present in busybox
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: kubedag-runner:v0
          # Long-lived container. The step's command is exec'd in, not run as
          # the container entrypoint, so this process just keeps the pod alive.
          command: ["sleep", "infinity"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: "1", memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # /work must be writable for step output
            capabilities:
              drop: ["ALL"]
          lifecycle:
            # Startup probe rather than liveness: a cold runner should not be
            # killed before it has finished booting, and Phase 3 adds real
            # work to pod startup.
            postStart:
              exec:
                command: ["/bin/sh", "-c", "mkdir -p /work && chmod 777 /work"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
      # No node selector: spread across whatever kind gives us. In production
      # this would carry topology spread constraints and a node pool dedicated
      # to untrusted workloads.
      terminationGracePeriodSeconds: 5